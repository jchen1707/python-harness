# Persistent equivalent of `codex --yolo` for this trusted project.
approval_policy = "never"
sandbox_mode = "danger-full-access"

[features]
hooks = true

[agents]
max_concurrent_threads_per_session = 8

[mcp_servers.pyright-lsp]
command = "/bin/sh"
args = [".codex/start-pyright-mcp.sh"]
startup_timeout_sec = 120
