# Guardrails: enforce lint/format/type + hygiene before commit. Run once:
#   uv run pre-commit install
# Then checks run automatically on `git commit`. Manual run:
#   uv run pre-commit run --all-files
# See CLAUDE.md -> Definition of Done.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: mixed-line-ending
        args: [--fix=lf]

  # Use the project's uv-installed ruff/mypy so versions match the dev environment.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (fix)
        entry: uv run ruff check --fix
        language: system
        types: [python]
        pass_filenames: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false