# `v2` is the source. `main` is a build artifact.
#
# The two branches used to be hand-maintained in parallel, which cost four authorings of
# every idea across this repository and its frontend twin, and produced the drift that
# consolidation exists to end. This job removes the second authoring: a change is written
# once on `v2`, and `main` is rebuilt from it.
#
# On a pull request it only *checks* that the build works and that the generated tree
# passes its own gates. Nothing is published until `v2` itself moves.
name: Generate main

on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]

permissions:
  contents: write

jobs:
  generate:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      # The generated tree is published to `main`, so both refs have to be reachable.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Build the main tree from this ref
        run: python .agents/transform/generate_main.py . "${RUNNER_TEMP}/main"

      # A generated branch is only as trustworthy as its gates. Running them here is what
      # makes "nobody hand-edits main" safe to say: a change on `v2` that would break the
      # Claude-specific branch fails on `v2`, rather than after the fact on a branch
      # nobody reads.
      - name: Sync dependencies for the generated tree
        working-directory: ${{ runner.temp }}/main
        run: uv sync --extra app

      - name: Gate the generated tree
        working-directory: ${{ runner.temp }}/main
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
          uv run pytest

      # The lease is what keeps this safe to automate: it refuses the push when `main`
      # moved after this job read it, which is the signal that somebody edited the
      # artifact by hand and their work is about to be overwritten.
      - name: Publish to main
        if: github.event_name == 'push'
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          source_subject="$(git log -1 --format=%s)"

          git fetch origin main
          rm -rf "${RUNNER_TEMP}/publish"
          git worktree add --detach "${RUNNER_TEMP}/publish" origin/main
          cd "${RUNNER_TEMP}/publish"

          # Replace the tree wholesale: a file deleted on `v2` has to disappear here too.
          git rm -rq --ignore-unmatch .
          cp -a "${RUNNER_TEMP}/main/." .
          git add -A

          if git diff --cached --quiet; then
            echo "main is already current"
            exit 0
          fi

          git commit -q \
            -m "build: regenerate main from v2@${source_sha:0:7}" \
            -m "${source_subject}" \
            -m "Generated by .github/workflows/generate-main.yml. Do not edit main by hand — the next push to v2 rebuilds it."
          git push --force-with-lease origin HEAD:main
