name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      # The hooks that enforce this repo's gates are JavaScript, and their suite runs
      # inside pytest. `.nvmrc` is what makes that dependency declared rather than
      # inherited from whatever the runner happens to ship -- which is the state this repo
      # was in for months while it ran `full-review.js` with no manifest at all.
      #
      # No cache: `setup-node` fails the job in post-cleanup when the cache path it was
      # told about does not exist, and there is no lockfile here to key one on. A red tick
      # for a reason unrelated to what the job measures is the worst kind.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Sync dependencies (dev tooling + approved app stack)
        # `dev` is a dependency-group (installed by default), not an optional-dependency
        # extra — so `--extra dev` would error. `--extra app` pulls in the approved stack.
        run: uv sync --extra app

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy

      - name: Test (pytest)
        run: uv run pytest

  # The fifth Definition of Done gate. Ubuntu only: testcontainers needs a Docker
  # daemon that runs Linux containers, which the Windows runners do not provide.
  integration:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies (dev tooling + approved app stack)
        run: uv sync --extra app

      - name: Test (pytest -m integration)
        run: uv run pytest -m integration