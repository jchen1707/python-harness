name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies (dev tooling + approved app stack)
        # `dev` is a dependency-group (installed by default), not an optional-dependency
        # extra — so `--extra dev` would error. `--extra app` pulls in the approved stack.
        run: uv sync --extra app

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy

      - name: Test (pytest)
        run: uv run pytest

  # The fifth Definition of Done gate. Ubuntu only: testcontainers needs a Docker
  # daemon that runs Linux containers, which the Windows runners do not provide.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies (dev tooling + approved app stack)
        run: uv sync --extra app

      - name: Test (pytest -m integration)
        run: uv run pytest -m integration